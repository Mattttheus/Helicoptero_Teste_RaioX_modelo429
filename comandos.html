  <style>
    .grupo-tit { display: flex; align-items: center; gap: 8px; margin: 14px 0 4px; font-weight: 700; }
    .grupo-tit i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    .peca { display: flex; justify-content: space-between; gap: 8px; padding: 6px 9px; border: 1px solid transparent; border-radius: 8px; cursor: pointer; }
    .peca:hover { border-color: var(--borda); } .peca.ativo { border-color: var(--acento); background: #2a1e12; }
    .peca small { color: var(--suave); font: 11px ui-monospace, Consolas, monospace; white-space: nowrap; }
    .proc { display: block; padding: 6px 8px; border-radius: 8px; text-decoration: none; color: inherit; border: 1px solid transparent; }
    .proc:hover { border-color: var(--acento); }
    .proc b { font-weight: 600; } .proc .sub { display: block; font-size: 11px; color: var(--suave); }
    .proc .dmc { font: 10px ui-monospace, Consolas, monospace; color: var(--azul); }
    .ctrl-sl { display: grid; grid-template-columns: 120px 1fr 52px; gap: 8px; align-items: center; margin: 6px 0; }
    .ctrl-sl input { width: 100%; accent-color: var(--acento); }
    .ctrl-sl output { font: 12px ui-monospace, Consolas, monospace; text-align: right; }
    #leituras { position: absolute; left: 12px; bottom: 44px; z-index: 3; background: #121821cc; border: 1px solid var(--borda); border-radius: 10px; padding: 8px 12px; font: 12px ui-monospace, Consolas, monospace; backdrop-filter: blur(4px); }
    .aviso-int { border-color: var(--alerta); }
    table.ipc { width: 100%; border-collapse: collapse; font-size: 11.5px; margin: 6px 0; }
    table.ipc th, table.ipc td { border-bottom: 1px solid var(--borda); padding: 3px 5px; text-align: left; vertical-align: top; }
    table.ipc td.pn { font: 11px ui-monospace, Consolas, monospace; color: var(--azul); white-space: nowrap; }
    .figs { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
    .fig { display: flex; flex-direction: column; width: 118px; text-decoration: none; color: var(--suave); font-size: 10.5px; border: 1px solid var(--borda); border-radius: 8px; padding: 4px; background: #fff1; }
    .fig img { width: 100%; height: 90px; object-fit: contain; background: #fff; border-radius: 5px; margin-bottom: 3px; }
    .fig:hover { border-color: var(--acento); }
    textarea.cola { width: 100%; height: 90px; font: 11px ui-monospace, Consolas, monospace; background: #0e141c; color: var(--texto); border: 1px solid var(--borda); border-radius: 8px; }
  </style>

<body class="pagina-motor">
  <div id="app">
    <aside id="painel">
      <header>
        <div class="marca"><a href="index.html" class="selo" id="selo" title="Voltar ao painel Manutenção Interativa">…</a>
          <div class="marca-txt"><h1>Comandos e painel 3D <small>· Manutenção Interativa</small></h1><p id="subModelo">carregando…</p></div>
        </div>
        <div class="linha topo"><select id="trocaModelo" title="Trocar de modelo" aria-label="Modelo"></select></div>
      </header>
      <nav id="abas" class="abas4" role="tablist" aria-label="Seções" style="grid-template-columns: repeat(4, 1fr)">
        <button data-aba="comandos" class="ativa" title="Cadeia de comando: cíclico, coletivo, pedais, servos (Alt+1)"><i>✥</i><span>Comandos</span></button>
        <button data-aba="painel" title="Painel de instrumentos e pedestal (Alt+2)"><i>▦</i><span>Painel</span></button>
        <button data-aba="teste" title="Mover os comandos e seguir a cadeia (Alt+3)"><i>▶</i><span>Teste</span></button>
        <button data-aba="procedimentos" title="Todos os procedimentos dos manuais Bell (índice interno) (Alt+4)"><i>☰</i><span>Procedimentos</span></button>
      </nav>
      <div id="conteudo"></div>
      <footer id="rodape">Comandos e painel ilustrativos e simplificados para treinamento. Não substituem o manual de manutenção do fabricante.</footer>
    </aside>

    <main id="vista">
      <div id="barra">
        <a class="botao" href="index.html" title="Voltar ao painel dos modelos">‹ Modelos</a>
        <a class="botao" id="btManual" href="manual.html" title="Manual interativo do helicóptero">Manual 3D</a>
        <a class="botao" id="btMotor" href="motor.html" title="Motor 3D">Motor 3D</a>
        <button id="btPainel" title="Esconde ou mostra o painel">Ocultar painel</button>
        <button id="btFuselagem" class="on" title="Mostra o contorno da fuselagem">Fuselagem</button>
        <button id="btCopiloto" title="Comandos duplos (copiloto)">Copiloto</button>
        <button id="btRotulos" title="Nomes das peças no 3D">Rótulos</button>
        <button id="btVistaPainel" title="Aproxima do painel de instrumentos">Ver painel</button>
        <button id="btGeral" title="Volta para a vista geral">Vista geral</button>
      </div>
      <div id="rotulos"></div>
      <div id="leituras" hidden></div>
      <div id="ajuda">Arraste para girar · role para aproximar · clique numa peça ou instrumento</div>
      <div id="erro" hidden></div>
    </main>
  </div>
